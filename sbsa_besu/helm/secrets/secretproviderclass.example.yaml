# =============================================================================
# helm/secrets/secretproviderclass.example.yaml
# -----------------------------------------------------------------------------
# SecretProviderClass — the in-cluster mapping that tells the Secrets Store CSI
# driver (stage 1) + AWS provider (stage 2, modules/secrets) WHICH AWS Secrets
# Manager secrets to fetch and HOW to expose them inside a pod.
#
# WHY THIS IS A COMMITTED TEMPLATE, NOT TERRAFORM
#   A SecretProviderClass is a CRD instance. Managing it with Terraform's
#   kubernetes_manifest forces Terraform to fetch the CRD's schema FROM THE
#   CLUSTER AT PLAN TIME — which fails on the very first apply because the CRD
#   (installed by the driver Helm release) does not exist yet. To avoid that
#   bootstrap trap, the SecretProviderClass ships as this committed manifest and
#   is applied by the Besu Helm chart (stage 3) or `kubectl apply` from the
#   In-VPC EC2 Runner, AFTER the driver + AWS provider are installed.
#
# WHEN IT RUNS
#   Stage 3, once per Besu node (each StatefulSet pod references the class that
#   maps ITS key). One node key per class keeps least privilege tight: a pod can
#   only mount the single secret it needs. Replace <NODE> per node.
#
# HOW A POD USES IT (mechanics)
#   1. The pod's service account is "quorum-node-secrets-sa" (annotated with the
#      IRSA role ARN from modules/iam — done in the Helm values, stage 3).
#   2. The pod mounts a CSI volume with driver "secrets-store.csi.k8s.io" that
#      references this class by name.
#   3. The AWS provider uses the pod's IRSA credentials to GetSecretValue on the
#      named secrets (allowed because they match the besu-node-* IRSA scope) and
#      writes each as a file at the mount path (e.g. /secrets/nodekey).
#   4. Besu is pointed at that file (--node-private-key-file, stage 3).
#
# PREREQUISITES (already in place by end of stage 2)
#   * secrets-store-csi-driver           (stage 1, modules/storage-csi)
#   * secrets-store-csi-driver-provider-aws (stage 2, modules/secrets)
#   * the named secrets exist in Secrets Manager (containers in stage 2; values
#     written by stage-3 genesis tooling)
# =============================================================================
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: besu-node-<NODE> # e.g. besu-node-validator-1
  namespace: besu
spec:
  provider: aws
  parameters:
    # 'region' must be the region the secrets live in (the primary region).
    region: <PRIMARY_REGION> # e.g. us-east-1 (non-prod) / af-south-1 (prod)
    # objects: one entry per Secrets Manager secret this pod may mount.
    # objectName is the secret NAME; objectAlias is the filename inside the pod.
    objects: |
      - objectName: "besu-node-<NODE>"   # the node's secp256k1 key
        objectType: "secretsmanager"
        objectAlias: "nodekey"
      - objectName: "besu-node-ca-cert"  # public CA cert (truststore content)
        objectType: "secretsmanager"
        objectAlias: "ca.crt"
