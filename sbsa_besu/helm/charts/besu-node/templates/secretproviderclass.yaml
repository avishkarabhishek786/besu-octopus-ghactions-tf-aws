# Per-node SecretProviderClass: mounts ONLY this node's key + the public CA
# cert. Because each node is its own release with its own nodeSecretName, a pod
# can read solely its own key (least privilege) — the Secrets Store CSI AWS
# provider (stage 2) fetches them using the read-only IRSA role on the SA.
#
# H7: this class defines `objects:` ONLY (file mounts into the pod's CSI tmpfs) and
# deliberately has NO `secretObjects:` block — so the decrypted secp256k1 node key
# is NEVER mirrored into a Kubernetes Secret in etcd. It lives only in the pod's
# in-memory CSI mount. Do NOT add `secretObjects:` here: it would sync the key into
# etcd and bypass the CMK custody (C12) + envelope encryption (H7).
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "besu-node.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "besu-node.labels" . | nindent 4 }}
spec:
  provider: aws
  parameters:
    region: {{ .Values.secretsRegion | quote }}
    objects: |
      - objectName: {{ required "nodeSecretName is required" .Values.nodeSecretName | quote }}
        objectType: "secretsmanager"
        objectAlias: "nodekey"
      - objectName: {{ .Values.caCertSecretName | quote }}
        objectType: "secretsmanager"
        objectAlias: "ca.crt"
      {{- if and (eq .Values.role "rpc") .Values.mtls.enabled }}
      # RPC mTLS material (stage 4): server keystore + CA truststore + passwords.
      - objectName: {{ .Values.mtls.keystoreSecret | quote }}
        objectType: "secretsmanager"
        objectAlias: "keystore-b64"
      - objectName: {{ .Values.mtls.truststoreSecret | quote }}
        objectType: "secretsmanager"
        objectAlias: "truststore-b64"
      - objectName: {{ .Values.mtls.keystorePasswordSecret | quote }}
        objectType: "secretsmanager"
        objectAlias: "keystore-pass"
      - objectName: {{ .Values.mtls.truststorePasswordSecret | quote }}
        objectType: "secretsmanager"
        objectAlias: "truststore-pass"
      {{- if eq .Values.rpcAuth.mode "tls-plus-method" }}
      - objectName: {{ .Values.rpcAuth.jwtPubkeySecret | quote }}
        objectType: "secretsmanager"
        objectAlias: "jwt-pubkey.pem"
      {{- end }}
      {{- if .Values.mtls.knownClientsSecret }}
      # H9: client-cert pinning — the Besu known-clients file (<CN> <sha256>), mounted
      # read-only at /secrets/known-clients. See --rpc-http-tls-known-clients-file.
      - objectName: {{ .Values.mtls.knownClientsSecret | quote }}
        objectType: "secretsmanager"
        objectAlias: "known-clients"
      {{- end }}
      {{- end }}
      {{- if and (eq .Values.role "app-rpc") .Values.appRpc.tls.enabled }}
      # Stage 8 app-rpc: CA-signed SERVER keystore (base64) + its password. No
      # truststore — server-TLS only (no client auth).
      - objectName: {{ .Values.appRpc.tls.keystoreSecret | quote }}
        objectType: "secretsmanager"
        objectAlias: "apprpc-keystore-b64"
      - objectName: {{ .Values.appRpc.tls.keystorePasswordSecret | quote }}
        objectType: "secretsmanager"
        objectAlias: "apprpc-keystore-pass"
      {{- end }}
      {{- if and (eq .Values.role "app-rpc") .Values.appRpc.auth.enabled }}
      - objectName: {{ .Values.appRpc.auth.jwtPubkeySecret | quote }}
        objectType: "secretsmanager"
        objectAlias: "apprpc-jwt-pubkey.pem"
      {{- end }}
      {{- if and (eq .Values.role "validator") .Values.opsRpc.enabled .Values.opsRpc.jwtPubkeySecret }}
      - objectName: {{ .Values.opsRpc.jwtPubkeySecret | quote }}
        objectType: "secretsmanager"
        objectAlias: "ops-jwt-pubkey.pem"
      {{- end }}
