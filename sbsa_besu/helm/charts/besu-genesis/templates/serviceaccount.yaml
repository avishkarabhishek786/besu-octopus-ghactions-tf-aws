# ServiceAccount for the genesis Job. Annotated with the WRITE-capable IRSA
# role (PutSecretValue on besu-node-*) so the Job can store generated node keys.
# This is a DIFFERENT role from the read-only pod role used by Besu nodes.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "besu-genesis.labels" . | nindent 4 }}
  annotations:
    eks.amazonaws.com/role-arn: {{ required "serviceAccount.roleArn is required (modules/iam besu_genesis_role_arn)" .Values.serviceAccount.roleArn | quote }}
---
# Read-only pod service account used by all Besu NODES (besu-node chart).
# Created here because the genesis release runs before the node releases.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.podServiceAccount.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "besu-genesis.labels" . | nindent 4 }}
  annotations:
    eks.amazonaws.com/role-arn: {{ required "podServiceAccount.roleArn is required (modules/iam besu_secrets_role_arn)" .Values.podServiceAccount.roleArn | quote }}
