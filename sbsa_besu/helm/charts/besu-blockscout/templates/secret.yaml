# DB password + Phoenix SECRET_KEY_BASE. Values are generated by Terraform
# (random_password) and passed at install — never hard-coded.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secret.name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "blockscout.labels" . | nindent 4 }}
type: Opaque
stringData:
  DB_PASSWORD: {{ required "secret.dbPassword is required (Terraform random_password)" .Values.secret.dbPassword | quote }}
  SECRET_KEY_BASE: {{ required "secret.secretKeyBase is required (Terraform random_password, 64 bytes)" .Values.secret.secretKeyBase | quote }}
