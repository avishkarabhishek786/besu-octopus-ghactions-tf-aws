name: CDS BULK UPLOAD API CI/CD

on:
  workflow_dispatch:
  push:
    branches:
      - master

env:
  OCTOPUS_PROJECT_NAME: osd-bulk-upload-api
  OCTOPUS_SPACE: "CIB Ops"
  OCTOPUS_URL: ${{ secrets.OCTOPUS_SERVER_URL }}
  OCTOPUS_API_KEY: ${{ secrets.OCTOPUSSERVERAPIKEY }}
  AWS_REGION: af-south-1
  ECR_REGISTRY: 112346747658.dkr.ecr.af-south-1.amazonaws.com
  ECR_REPOSITORY: xxx/osd-bulk-upload-api
  SONARQUBE_SCAN_ENABLED: True
  CHECKMARX_SCAN_ENABLED: True

jobs:
  run-security-checks-scans:
    name: Run DevSecOps Vulnerability Scans (SonarQube & Checkmarx)
    uses: xxx/.github/.github/workflows/security_checks.yml@main
    with:
      sonarqube_scan_enabled: true
      checkmarx_scan_enabled: true
    secrets: inherit

  generate-release-version:
    name: Generate release version
    runs-on: ubuntu-latest
    outputs:
      release-version: ${{ steps.set-version.outputs.release-version }}
    steps:
      - name: Set release version
        id: set-version
        run: |
          RELEASE_VERSION="1.0.${{ github.run_number }}"
          echo "release-version=$RELEASE_VERSION" >> $GITHUB_OUTPUT
          echo "Generated release: $RELEASE_VERSION"

  build-and-deploy:
    name: Build and Deploy
    runs-on: [self-hosted, kubernetes]
    needs: generate-release-version
    env:
      RELEASE_VERSION: ${{ needs.generate-release-version.outputs.release-version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.DEV_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.DEV_AWS_SECRET_ACCESS_KEY }}
          aws-region: af-south-1
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build, tag, and push image to Amazon ECR
        run: |
          echo "Building and pushing Docker image tagged: $RELEASE_VERSION"

          docker build --network=host -t $ECR_REGISTRY/$ECR_REPOSITORY:$RELEASE_VERSION -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$RELEASE_VERSION
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

          echo "Image: $ECR_REGISTRY/$ECR_REPOSITORY:$RELEASE_VERSION"

  deploy:
    name: Create release in Octopus Deploy
    runs-on: [self-hosted, kubernetes]
    needs:
      - generate-release-version
      - build-and-deploy
    env:
      RELEASE_VERSION: ${{ needs.generate-release-version.outputs.release-version }}
    steps:
      - name: Build release notes
        id: release-notes
        uses: xxx/release-note-action@main
        with:
          access-token: ${{ secrets.GITHUB_TOKEN }}
          target_branch: master
          workflow_file: ci-cd.yml

      - name: Add Security Checks to Release Notes
        run: |
          cat >> ${{ github.workspace }}/auto-release-notes.md << 'EOF'
          
          # Security Checks
          
          - SonarQube Enabled: ${{ env.SONARQUBE_SCAN_ENABLED }}
          - Checkmarx Enabled: ${{ env.CHECKMARX_SCAN_ENABLED }}
          EOF

      - name: Print release notes
        run: cat ${{ github.workspace }}/auto-release-notes.md

      - name: Write release notes to Job Summary
        run: cat ${{ github.workspace }}/auto-release-notes.md >> $GITHUB_STEP_SUMMARY

      - name: Upload release notes artefact
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: '${{ github.workspace }}/auto-release-notes.md'

      - name: Create Release in Octopus
        uses: OctopusDeploy/create-release-action@v3
        with:
          project: ${{ env.OCTOPUS_PROJECT_NAME }}
          release_number: ${{ env.RELEASE_VERSION }}
          release_notes_file: '${{ github.workspace }}/auto-release-notes.md'
          package_version: ${{ env.RELEASE_VERSION }}

      - name: Deploy Release to Dev
        uses: OctopusDeploy/deploy-release-action@v3
        with:
          project: ${{ env.OCTOPUS_PROJECT_NAME }}
          release_number: ${{ env.RELEASE_VERSION }}
          environments: 'DEV'

      - name: Deployment Summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Release Version:** ${{ env.RELEASE_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "**Project:** ${{ env.OCTOPUS_PROJECT_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** 🟩 Release created in Octopus Deploy" >> $GITHUB_STEP_SUMMARY
