# =============================================================================
# release.yml — check the platform, package it, and hand it to Octopus.
# -----------------------------------------------------------------------------
# CICD design notes §4.2, CD-68. A BANK DELIVERABLE: every bank-, instance- and
# person-specific value is a repository variable (CD-10), and nothing here
# holds a credential.
#
# IT NEVER TOUCHES A CLUSTER OR AN AWS ENVIRONMENT (CD-2). It checks, packages
# and creates a release. Octopus deploys — and with this repository's lifecycle
# (CD-41), CREATING A RELEASE DEPLOYS SIT AUTOMATICALLY. That is why this
# workflow is dispatched by a person, one project at a time, and not run on
# every merge: a besu-infra release applies three Terraform roots in SIT. Add a
# `push` trigger only once that is what you want every merge to do.
#
# Three jobs:
#   check    terraform fmt + validate on every root, helm lint, shellcheck,
#            the manifest/Terraform drift check. No credentials of any kind.
#   package  sbsa-besu-platform.<version>.tar.gz — terraform/, helm/, scripts/,
#            octopus/ and RELEASE.json, from git, so nothing gitignored
#            (real tfvars, hand-overs, state) can be in it. Version scheme CD-8.
#   publish  OIDC sign-in to Octopus (no API key — CD-9), push the package,
#            and, if a project was chosen: create the release, then WAIT for
#            the SIT deployment it triggers and fail if it fails (CD-21).
#
# NOT HERE YET, said plainly: the H1 plan-safety gate (H38) — failing a build
# whose plan would restart more than one validator. It needs a real plan, so
# AWS credentials and state; it belongs with the validator release once the
# chain's in-cluster layer deploys through Octopus (CD-67).
#
# Repository variables (Settings → Secrets and variables → Actions → Variables,
# REPOSITORY level — an Environment changes the OIDC subject to
# `…:environment:<name>`, which octopus/ci-trust does not trust):
#   OCTOPUS_URL                  https://<instance>.octopus.app
#   OCTOPUS_SPACE                the space name, e.g. Default
#   OCTOPUS_SERVICE_ACCOUNT_ID   the CI service account's GUID (octopus/ci-trust
#                                output `service_account` says where to read it)
#   RELEASE_RUNNER_LABELS        optional JSON array; falls back to CI_RUNNER_LABELS.
#                                Separate on purpose: this job packages OUR source,
#                                and policy may place it differently from the
#                                public-artefact mirror (CD-18).
# =============================================================================

name: release

on:
  workflow_dispatch:
    inputs:
      project:
        description: "Create a release in this project — which DEPLOYS SIT automatically. 'none' publishes the package only."
        type: choice
        options: [none, besu-infra, besu-workloads, besu-validators]
        default: none
      await_minutes:
        description: "How long to wait for the SIT deployment (besu-validators waits on its manual gate)"
        type: number
        default: 60

permissions:
  contents: read

# One release at a time: two besu-infra releases would queue two SIT applies
# against the same state (CD-14 serialises them in Octopus; this keeps the
# version numbers and the waits readable too).
concurrency:
  group: release
  cancel-in-progress: false

env:
  PACKAGE_ID: sbsa-besu-platform
  # CI-only tool, so pinned HERE rather than in runner-tools.manifest — the same
  # rule as crane in supply-chain.yml (scripts/lib/common.sh). Resolved from the
  # upstream release 2026-10-10; sha256 of shellcheck-v0.11.0.linux.x86_64.tar.xz.
  SHELLCHECK_VERSION: v0.11.0
  SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198

jobs:
  # ---------------------------------------------------------------------------
  check:
    runs-on: ${{ fromJSON(vars.RELEASE_RUNNER_LABELS || vars.CI_RUNNER_LABELS) }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: sbsa_besu
    steps:
      - uses: actions/checkout@v7

      - name: Install terraform, helm and shellcheck
        run: |
          set -euo pipefail
          # terraform and helm come from the pinned manifest the In-VPC EC2
          # Runner and the Octopus steps use — one toolchain (CD-23). Restating
          # versions here is how CI and deployment drift apart.
          source scripts/lib/common.sh
          tmp="$(mktemp -d)"
          for t in terraform helm; do
            [ "$(tool_sha "$t")" != "-" ] || { echo "::error::$t is unpinned in runner-tools.manifest"; exit 1; }
            curl -fsSL -o "$tmp/$t.pkg" "$(tool_url "$t")"
            echo "$(tool_sha "$t")  $tmp/$t.pkg" | sha256sum -c -
          done
          python3 -c 'import zipfile,sys; zipfile.ZipFile(sys.argv[1]).extract("terraform", sys.argv[2])' "$tmp/terraform.pkg" "$tmp"
          tar -xzf "$tmp/helm.pkg" -C "$tmp" --strip-components=1 linux-amd64/helm
          curl -fsSL -o "$tmp/sc.tar.xz" \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  $tmp/sc.tar.xz" | sha256sum -c -
          tar -xJf "$tmp/sc.tar.xz" -C "$tmp" --strip-components=1 "shellcheck-${SHELLCHECK_VERSION}/shellcheck"
          mkdir -p "$HOME/.local/bin"
          install -m 0755 "$tmp/terraform" "$tmp/helm" "$tmp/shellcheck" "$HOME/.local/bin/"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff terraform octopus

      # -backend=false: validation needs providers, not state. The handover.tf
      # symlinks are tracked, so a clean checkout validates exactly as the
      # laptop does (checked 2026-10-10 on a git-archive export).
      - name: terraform validate (every root)
        run: |
          set -euo pipefail
          export TF_PLUGIN_CACHE_DIR="$RUNNER_TEMP/tf-plugins"; mkdir -p "$TF_PLUGIN_CACHE_DIR"
          for r in terraform/shared terraform/runner terraform/chain octopus/aws-trust octopus/terraform octopus/ci-trust; do
            echo "::group::$r"
            terraform -chdir="$r" init -backend=false -input=false -no-color >/dev/null
            terraform -chdir="$r" validate -no-color
            echo "::endgroup::"
          done

      - name: helm lint
        run: for c in helm/charts/*/; do helm lint "$c"; done

      # -S error gates. The 17 warning-level findings that predate this
      # workflow (2026-10-10, mostly SC2034/SC2206/SC2207) are reported, not
      # gated, so the first run measures the code instead of failing on its past.
      # Tighten to -S warning once they are cleared.
      - name: shellcheck
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files '*.sh')
          shellcheck -x -S error "${files[@]}"
          n="$(shellcheck -x -S warning -f gcc "${files[@]}" | wc -l || true)"
          echo "shellcheck: 0 errors, ${n} warnings (not gated)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Manifest agrees with Terraform (images and digests)
        run: ./scripts/supply-chain/mirror.sh --check-drift

  # ---------------------------------------------------------------------------
  package:
    needs: check
    runs-on: ${{ fromJSON(vars.RELEASE_RUNNER_LABELS || vars.CI_RUNNER_LABELS) }}
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      # CD-8: YYYY.M.D.<run_number> — ONE number, both the package version and
      # the release number. Month and day carry NO leading zero: Octopus parses
      # versions as SemVer-like, where a leading zero is not canonical, and a
      # package filed as 2026.11.1.7 under a release asking for 2026.11.01.7 is
      # an argument nobody should have to win.
      - name: Version
        id: version
        run: echo "version=$(date -u +%Y.%-m.%-d).${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Build the package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          pkg="$RUNNER_TEMP/pkg"; mkdir -p "$pkg"
          # From GIT, not the working tree: gitignored files (real tfvars,
          # hand-overs, state, provider caches) cannot be in it by construction.
          # The package root is the sbsa_besu tree, which the step scripts
          # expect (octopus/steps/*.sh resolve ../.. as the package).
          git archive --format=tar HEAD:sbsa_besu terraform helm scripts octopus | tar -x -C "$pkg"
          # Saved plans ARE tracked in this repository as run evidence — and a
          # plan carries the state it was made against. Never ship one.
          find "$pkg" -name '*.plan' -delete
          cat > "$pkg/RELEASE.json" <<EOF
          {"package": "${PACKAGE_ID}", "version": "${VERSION}", "commit": "${GITHUB_SHA}", "ref": "${GITHUB_REF}",
           "run": "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"}
          EOF
          # --dereference: the tracked handover.tf symlinks become files. The
          # extractor on an Octopus worker is not guaranteed to recreate a
          # symlink, and without that file `shared` and `chain` do not plan.
          out="$RUNNER_TEMP/${PACKAGE_ID}.${VERSION}.tar.gz"
          tar --dereference -czf "$out" -C "$pkg" .
          # Refuse to publish anything that looks like state or real config.
          bad="$(tar -tzf "$out" | grep -E '\.plan$|\.tfstate|\.auto\.tfvars$|/environments/[^/]+/[^/]+\.tfvars$|\.pem$|(^|/)\.env$' || true)"
          [ -z "$bad" ] || { echo "::error::refusing to package:"; echo "$bad"; exit 1; }
          echo "PKG=$out" >> "$GITHUB_ENV"
          { echo "### Package"; echo; echo "\`$(basename "$out")\` — $(du -h "$out" | cut -f1), $(tar -tzf "$out" | wc -l) entries, commit \`${GITHUB_SHA::7}\`"; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: package
          path: ${{ env.PKG }}
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------------
  publish:
    needs: package
    runs-on: ${{ fromJSON(vars.RELEASE_RUNNER_LABELS || vars.CI_RUNNER_LABELS) }}
    # Expressions have no arithmetic, so this is a ceiling, not await + margin:
    # keep await_minutes under it (the find step refuses more).
    timeout-minutes: 180
    permissions:
      contents: read
      id-token: write # OIDC sign-in to Octopus. No API key is stored (CD-9).
    env:
      VERSION: ${{ needs.package.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: package
          path: ${{ runner.temp }}/package

      # Same purpose as in supply-chain.yml: if the sign-in is refused, this
      # line is the exact value octopus/ci-trust must trust — not a guess.
      # Audience is irrelevant to `sub`; the token is masked, never printed.
      - name: Show the OIDC subject
        continue-on-error: true
        run: |
          set -euo pipefail
          tok="$(curl -fsSL -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}" \
                 | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          echo "::add-mask::${tok}"
          sub="$(python3 -c 'import base64,json,sys; p=sys.argv[1].split(".")[1]; p+="="*(-len(p)%4); print(json.loads(base64.urlsafe_b64decode(p))["sub"])' "$tok")"
          echo "OIDC sub: ${sub}"
          echo "**OIDC subject:** \`${sub}\`" >> "$GITHUB_STEP_SUMMARY"

      # Exchanges the GitHub token for a short-lived Octopus access token as the
      # CI service account (octopus/ci-trust). Sets OCTOPUS_URL and
      # OCTOPUS_ACCESS_TOKEN for every later Octopus step.
      - name: Sign in to Octopus (OIDC)
        uses: OctopusDeploy/login@v2
        with:
          server: ${{ vars.OCTOPUS_URL }}
          service_account_id: ${{ vars.OCTOPUS_SERVICE_ACCOUNT_ID }}

      # FailIfExists: a version is published once. The CI role cannot replace
      # or delete packages either (no BuiltInFeedAdminister) — a release number
      # always means the same bytes.
      - name: Push the package
        uses: OctopusDeploy/push-package-action@v4
        with:
          space: ${{ vars.OCTOPUS_SPACE }}
          packages: ${{ runner.temp }}/package/${{ env.PACKAGE_ID }}.${{ env.VERSION }}.tar.gz
          overwrite_mode: FailIfExists

      - name: Create the release
        if: inputs.project != 'none'
        uses: OctopusDeploy/create-release-action@v4
        with:
          space: ${{ vars.OCTOPUS_SPACE }}
          project: ${{ inputs.project }}
          release_number: ${{ env.VERSION }}
          package_version: ${{ env.VERSION }}
          release_notes: |
            ${{ github.repository }}@${{ github.sha }} (${{ github.ref_name }})
            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      # CD-21: a queued deployment is not a deployed one. The lifecycle starts
      # the SIT deployment by itself, so there is no task id to hand over —
      # find it on the release, then wait for it below.
      - name: Find the SIT deployment
        id: find
        if: inputs.project != 'none'
        env:
          SPACE: ${{ vars.OCTOPUS_SPACE }}
          PROJECT: ${{ inputs.project }}
          AWAIT_MINUTES: ${{ inputs.await_minutes }}
        run: |
          set -euo pipefail
          [ "$AWAIT_MINUTES" -ge 1 ] && [ "$AWAIT_MINUTES" -le 160 ] || { echo "::error::await_minutes must be 1..160 (job ceiling 180)"; exit 1; }
          echo "timeout=$(( AWAIT_MINUTES * 60 ))" >> "$GITHUB_OUTPUT"
          api() { curl -fsS -H "Authorization: Bearer ${OCTOPUS_ACCESS_TOKEN}" "${OCTOPUS_URL%/}/api/$1"; }
          sid="$(api spaces/all | python3 -c 'import json,os,sys; print(next(s["Id"] for s in json.load(sys.stdin) if s["Name"]==os.environ["SPACE"]))')"
          rid="$(api "$sid/projects/$PROJECT/releases/$VERSION" | python3 -c 'import json,sys; print(json.load(sys.stdin)["Id"])')"
          task=""
          for _ in $(seq 1 18); do
            task="$(api "$sid/releases/$rid/deployments" | python3 -c 'import json,sys; i=json.load(sys.stdin)["Items"]; print(i[0]["TaskId"] if i else "")')"
            [ -n "$task" ] && break
            sleep 5
          done
          if [ -z "$task" ]; then
            echo "::notice::No deployment started within 90 s — the lifecycle's first phase is not automatic for $PROJECT. Release $VERSION exists; deploy it from Octopus."
            exit 0
          fi
          echo "task=$task" >> "$GITHUB_OUTPUT"
          echo "Deployment: ${OCTOPUS_URL%/}/app#/$sid/tasks/$task" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Wait for the SIT deployment
        id: await
        if: steps.find.outputs.task != ''
        uses: OctopusDeploy/await-task-action@v4
        with:
          space: ${{ vars.OCTOPUS_SPACE }}
          server_task_id: ${{ steps.find.outputs.task }}
          timeout_after: ${{ steps.find.outputs.timeout }}

      # Belt and braces for CD-21: whatever the action does with a failed task,
      # this job is green only when Octopus says the deployment succeeded.
      - name: The deployment must have succeeded
        if: steps.find.outputs.task != ''
        env:
          STATE: ${{ steps.await.outputs.task_state }}
        run: |
          echo "SIT deployment: ${STATE:-unknown}" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$STATE" = "Success" ]
